<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ADSolutions Private Preview Environment</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#102a4b 0,#07182e 38%,#03101f 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
    main{width:min(760px,calc(100% - 40px));padding:56px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(255,255,255,.055);backdrop-filter:blur(20px);box-shadow:0 35px 100px rgba(0,0,0,.35)}
    .mark{font-weight:900;letter-spacing:.08em;font-size:14px;color:#75cfff}
    h1{font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.05em;margin:18px 0 20px}
    p{font-size:18px;line-height:1.7;color:rgba(255,255,255,.72);max-width:600px;margin:0}
    .line{height:1px;background:linear-gradient(90deg,#1f8cff,transparent);margin:34px 0}
    small{color:rgba(255,255,255,.48)}
  </style>
</head>
<body>
  <main>
    <div class="mark">ADSOLUTIONS</div>
    <h1>Private Preview Environment</h1>
    <p>This environment hosts private website concepts prepared for ADSolutions prospects and clients. Preview links are shared individually and are not publicly listed here.</p>
    <div class="line"></div>
    <small>Strategy · Innovation · Growth</small>
  </main>
</body>
</html>
